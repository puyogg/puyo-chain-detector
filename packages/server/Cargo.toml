[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "^0.25"
imageproc = "^0.26"
nokhwa = { version = "0.10.10", features = ["input-native", "output-wgpu"] }
poem = { version = "^3.1.2", features = ["server", "test", "websocket", "embed" ] }
poem-openapi = { version = "^5.1.2", features = ["swagger-ui", "chrono"] }
rust-embed = "8.11"
serde = "1.0.203"
serde_json = { version = "1.0.117", features = ["raw_value"] }
tokio = { version = "~1.49.0", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }

[[bin]]
name = "test"
test = false
